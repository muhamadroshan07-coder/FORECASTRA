name: Deploy FORECASTRA API to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - "FORECASTRA_GitHub_Pages_Ready/worker/**"
      - ".github/workflows/deploy-forecastra-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "FORECASTRA_GitHub_Pages_Ready/worker"
          command: deploy

      - name: Sync configured provider secrets
        working-directory: "FORECASTRA_GitHub_Pages_Ready/worker"
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VISUAL_CROSSING_KEY: ${{ secrets.VISUAL_CROSSING_KEY }}
          WEATHER_API_2_KEY: ${{ secrets.WEATHER_API_2_KEY }}
          WEATHER_API_3_KEY: ${{ secrets.WEATHER_API_3_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: |
          set -euo pipefail
          for secret_name in GROQ_API_KEY VISUAL_CROSSING_KEY WEATHER_API_2_KEY WEATHER_API_3_KEY SUPABASE_URL SUPABASE_ANON_KEY CESIUM_ION_TOKEN; do
            secret_value="$(printenv "$secret_name" || true)"
            if [ -n "$secret_value" ]; then
              printf '%s' "$secret_value" | npx --no-install wrangler secret put "$secret_name"
              echo "Synced $secret_name"
            else
              echo "Skipping $secret_name (not added to GitHub Actions secrets yet)"
            fi
          done
