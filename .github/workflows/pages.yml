name: Deploy FORECASTRA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript and required assets
        run: |
          node --check FORECASTRA_GitHub_Pages_Ready/docs/app.js
          test -f FORECASTRA_GitHub_Pages_Ready/docs/index.html
          test -f FORECASTRA_GitHub_Pages_Ready/docs/config.js
          test -f FORECASTRA_GitHub_Pages_Ready/docs/styles.css
          grep -q "forecastra-visual-crossing" FORECASTRA_GitHub_Pages_Ready/docs/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: FORECASTRA_GitHub_Pages_Ready/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
